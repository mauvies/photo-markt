name: supabase-advisors

# Supabase's security linter, as a gate (T-225). It found the PR #279 email leak
# in one call while living in no workflow — it ran only when somebody remembered
# to look, which is what did not happen for eighteen months.
#
# Scope: PRs that touch the schema (or this gate itself). Most PRs never run it.
#
# ACTIONS COST: one job, no Docker, no pnpm install — a single `curl` plus a
# ~4 MB tsx-only dependency install. ~30–40 s per run on the handful of PRs that
# touch supabase/migrations/**. Budgeted deliberately: the Actions allowance has
# been exhausted once already (see T-217), which is why this is path-gated and
# not another step in the `test` job.
#
# ⚠️ Runs against STAGING, pinned in scripts/advisors-baseline.ts. A Supabase PAT
# is account-wide — there is no per-project management token — so the ref in the
# repo, not the credential, is what keeps this off production.
#
# Secret required: SUPABASE_ACCESS_TOKEN (Supabase personal access token).
# Absent secret ⇒ the job fails loudly rather than passing with zero findings.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/advisors-baseline.ts'
      - 'scripts/supabase-advisors.ts'
      - 'scripts/check-supabase-advisors.ts'
      - '.github/workflows/supabase-advisors.yml'

concurrency:
  group: supabase-advisors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisors:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Just the TypeScript runner — the check makes one HTTP call and needs
      # nothing else from the dependency tree. `pnpm install` here would cost
      # more minutes than the check itself.
      - name: Install tsx
        run: pnpm add --global tsx

      - name: Supabase security advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: tsx scripts/check-supabase-advisors.ts
