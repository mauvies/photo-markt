name: test

# Fast, Docker-free gate: typecheck + lint + unit tests + the unit coverage
# ratchet (T-222). Runs on every code PR.
# Integration tests (which boot local Supabase) live in test-integration.yml and
# only run when DB/query/API/lib code changes — most PRs (UI, i18n, components)
# never pay the Supabase image pull. The full suite still runs locally before
# every push (the /work-next flow), so CI is a secondary net, not the gate.
on:
  pull_request:
    # Skip PRs that only touch docs/backlog/specs — no code to test.
    paths-ignore:
      - 'backlog/**'
      - 'docs/**'
      - 'openspec/**'
      - '**.md'

# Cancel superseded runs on the same branch — saves minutes on rapid PR pushes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    # No Docker here, so this is fast; the cap only guards a hung install.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Biome — ~0.5s, negligible cost on top of an already-running job.
      - name: Lint
        run: pnpm lint

      # Unit tests WITH the coverage ratchet (T-222). Same tests as
      # `pnpm test:unit`, ~10s more for the v8 instrumentation, and it is the
      # only coverage check that can block a PR — the full-suite floor needs
      # Postgres and so is enforced locally by `pnpm test:coverage`.
      - name: Unit tests + coverage gate
        run: pnpm test:coverage:unit
