name: test-integration

# Slow gate: boots local Supabase (Docker) and runs the integration suite. Only
# triggered when code that integration tests actually exercise changes — DB
# queries, server actions, API routes, shared lib, the Supabase schema/seed, or
# the tests/helpers themselves. Pure UI/i18n/component PRs skip this entirely and
# only pay the fast `test` workflow. The full suite still runs locally before
# every push, so a path this list misses is caught pre-push, not in prod.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/database/**'
      - 'src/app/api/**'
      - 'src/app/**/actions.ts'
      - 'src/lib/**'
      - 'supabase/**'
      - 'test/integration/**'
      - 'test/helpers/**'
      - 'test/setup.ts'
      - 'env.mjs'
      - 'vitest.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-integration.yml'

concurrency:
  group: test-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    # The Supabase image pull dominates a cold run but stays well under this.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        # `--exclude` trims every service the tests never touch (Studio, meta,
        # imgproxy, analytics, vector, realtime, edge functions, inbucket) — the
        # tests only hit db, rest, auth, storage and kong. Fewer images to pull.
        run: pnpm exec supabase start --exclude studio,meta,imgproxy,analytics,vector,realtime,edge-runtime,functions,inbucket

      - name: Integration tests
        # Only the integration dir — unit tests already ran in the `test`
        # workflow, and the Supabase stack is already up from the step above.
        run: pnpm exec vitest run test/integration

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
