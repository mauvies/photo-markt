# Local Supabase stack configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# These ports are the Supabase CLI defaults. We pin them here so contributors
# get a consistent local environment and so the test helper can hardcode
# `http://127.0.0.1:54321` without env-var juggling.

project_id = "picdemi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Photo uploads are capped at 50 MB by lib/photo-upload.ts; keep storage's
# server-side cap a bit higher so legitimate edge cases aren't blocked here.
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.external.google]
enabled = false

# Vector / pgvector is used by photo_embeddings + ai_search_profiles. The
# extension is enabled by the migrations themselves; nothing to set here.
